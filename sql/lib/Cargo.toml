[package]
name = "jj-sql-lib"
description = "SQL backend for Jujutsu"

version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[dependencies]
async-trait = { workspace = true }
blake2 = { workspace = true }
clru = { workspace = true }
either = "1"
futures = { workspace = true }
itertools = { workspace = true }
jj-lib = { workspace = true }
jj-sql-macro = { path = "../macro" }
postcard = { version = "1", features = ["alloc"] }
proptest-derive = { version = "0.8" }
proptest = { version = "1" }
rusqlite = { version = "0.39.0", features = ["vtab"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.9", features = ["macros", "runtime-tokio", "sqlite"] }
thiserror = { workspace = true }
tokio = { workspace = true }
zerocopy = { workspace = true }
zstd = "0.13.3"

[dev-dependencies]
anyhow = "1"
criterion = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[build-dependencies]
anyhow = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }


[[bench]]
name = "simhash"
harness = false
